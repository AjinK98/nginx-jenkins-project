name: Docker Build And Push To Docker Hub

on:
  push:
    branches:
      - main
    workflow_dispatch:
  
env:
  REPO: app

jobs:
  build:
    name: Nodejs Demo App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        id: buildAndPushImage
        uses: MaximilianoBz/dockerhub-buildpush@v1.0
        with:
          registry_url: 'docker.io'
          repository_name: ${{ env.REPO }}
          user_name: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          image_version: ${{ github.run_number }}
          docker_file: '.'
      - name: Get pre step result output image_pull_url
        run: echo "Completed....."

    
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |

            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ github.run_number }}
            sudo docker run --name myapp -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO }}:${{ github.run_number }}


